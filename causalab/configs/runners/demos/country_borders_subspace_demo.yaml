# @package _global_
defaults:
  - /base
  - /task: country_borders
  - /model: gemma3_4b_pt
  - /analysis/subspace
  - _self_
task:
  enumerate_all: true # training on all possible examples, test = train
  target_variable: country

subspace:
  method: pca
  # Single layer (no sweep): localized site for the country variable, layer 12.
  # Downstream activation_manifold/path_steering cells lock onto this layer.
  layers: [12]
  k_features: 32
  token_positions: [country]
  visualization:
    figure_format: png
