# @package graph_path_steering
# Hydra config for the session-local analysis `graph_path_steering`.
# Mounted at cfg.graph_path_steering via the # @package directive.
# Picked up automatically when CAUSALAB_SESSION_CODE is set (scripts/run_exp.sh,
# whenever --experiment-root lives under agent_logs/).

_name_: graph_path_steering           # sentinel — must match ANALYSIS_NAME in main.py
_subdir: ${.subspace}/${.activation_manifold}
_output_dir: ${experiment_root}/graph_path_steering/${._subdir}

# Pin the country_borders fit (do NOT rely on null auto-discovery).
subspace: pca_k32                     # subspace dir under ${experiment_root}/subspace/
activation_manifold: L33_last_token/spline_s0.0  # manifold cell under activation_manifold/${subspace}/

# What to steer and compare.
selected_pairs:
  - ["Spain", "Russia"]
  - ["Portugal", "Finland"]
  - ["Greece", "Norway"]
  - ["Portugal", "Greece"]
path_modes: [graph_geodesic, geometric, linear, oracle]  # graph route, manifold geodesic, straight line, geographic-oracle route

# Oracle routes (mode `oracle`): geographic routes where every edge is a true border
# in the task's NEIGHBOR_OF table (BFS shortest paths over the symmetrized table).
# Steered exactly like graph_geodesic (piecewise-linear between raw centroids,
# identity featurizer) — isolates route quality from route construction.
# Keyed "<start>_<end>" per selected pair.
oracle_routes:
  Spain_Russia: [Spain, France, Germany, Poland, Belarus, Russia]
  Portugal_Finland: [Portugal, Spain, France, Germany, Denmark, Norway, Finland]
  Greece_Norway: [Greece, Bulgaria, Romania, Ukraine, Russia, Norway]
  Portugal_Greece: [Portugal, Spain, France, Germany, Austria, Hungary, Romania, Bulgaria, Greece]

# Graph-geodesic knobs (consumed by methods.centroid_graph_geodesic).
graph_k: 4                            # k for the k-NN centroid graph (auto-bumped if disconnected)
steps_per_segment: 6                  # interpolation points per route segment

# Baseline-path + steering knobs.
num_steps_along_path: 25              # steps for geometric/linear straight paths
n_eval_samples: 64                    # counterfactual eval prompts to generate
n_prompts: 16                         # base prompts steered per path step
batch_size: 16                        # inference batch size

visualization:
  figure_format: png                  # png or pdf — invariant 6
