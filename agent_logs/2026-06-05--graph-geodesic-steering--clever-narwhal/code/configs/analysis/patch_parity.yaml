# @package patch_parity
# Hydra config for the session-local analysis `patch_parity`.
# Mounted at cfg.patch_parity via the # @package directive.
# The runner's session-code search path picks this file up automatically when
# CAUSALAB_SESSION_CODE is set (scripts/run_exp.sh, whenever --experiment-root
# lives under agent_logs/ — or when the runner config itself is session-local).

_name_: patch_parity                  # sentinel — must match ANALYSIS_NAME in main.py
_subdir: ${.subspace}
_output_dir: ${experiment_root}/patch_parity/${._subdir}

# Site + centroid source: the subspace dir whose raw_features.safetensors,
# train_dataset.json, and (layer, token_position) metadata define everything.
subspace: pca_k32

# Target countries whose raw centroids get patched (one full arm set per country).
countries: ["Spain", "Russia"]

# Which mechanisms to compare. interchange_source = locate's working mechanism;
# interpolation_replica = the steering executor under suspicion (verbatim replace_fn);
# interpolation_shapefix = same executor with the rank-fixed replacement;
# no_patch = the no-effect floor (run once, shared across countries).
arms: [interchange_source, interpolation_replica, interpolation_shapefix, no_patch]

# Eval prompts — identical construction + seed offset to graph_path_steering
# (generate_dataset(causal_model, n_eval_samples, seed + 100), first n_prompts kept).
n_eval_samples: 64
n_prompts: 16
batch_size: 16

# false = production parity (arms B/B2 receive samples with their real
# counterfactual_inputs, exactly as collect_grid_distributions does);
# true = self-pairs like arm A, to rule out the source-prompt confound on a re-run.
interpolation_self_pairs: false
