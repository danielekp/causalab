# @package _global_
# MUST stay session-local: run_exp.sh injects the session Hydra --config-dir only when
# the runner config itself is session-local (same constraint as
# country_borders_patch_parity.yaml).
#
# Defaults point at the VALIDATED steering site (patch_parity verdict 2026-06-12):
# L12 / `country` token position, subspace pca_k32_ctok. The earlier L33/last_token
# site is trivial for steering (final layer freezes the output to the patched
# centroid's marginal). path_modes is NOT pinned here — the analysis config supplies
# it (including the `oracle` true-border route mode).
defaults:
  - /base
  - /task: country_borders
  - /model: gemma3_4b_pt
  - /analysis/graph_path_steering
  - _self_
task:
  target_variable: country
graph_path_steering:
  subspace: pca_k32_ctok
  activation_manifold: L12_country/spline_s0.0
  # selected_pairs / path_modes / oracle_routes come from the analysis config.
  graph_k: 4
  steps_per_segment: 6
  visualization:
    figure_format: png
