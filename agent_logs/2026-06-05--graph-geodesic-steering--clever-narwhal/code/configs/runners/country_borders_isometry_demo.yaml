# @package _global_
# Reproduce the manifold-steering paper's Fig 2/3 isometry validation
# (activation manifold <-> behavior/"belief" manifold) for country_borders on
# Gemma3-4B-PT, at the VALIDATED steering site: L12 / `country` token,
# subspace pca_k32_ctok. See result/REPORT.md and patch_parity_verdict.md.
#
# MUST stay session-local: run_exp.sh injects the session Hydra --config-dir
# only when the runner config itself is session-local (same constraint as
# country_borders_patch_parity.yaml / country_borders_graph_steering_demo.yaml).
#
# ---------------------------------------------------------------------------
# What this produces (the three Fig-3 panels)
#   1. "Scaled Isometry"  (D_Y vs D_X scatter, Pearson r for geometric vs
#      linear) -> path_steering `isometry` criterion + `isometry_visualization`.
#      Computed purely from the two fitted manifolds (no interventions).
#   2. "Structural correspondence" + "MDS"  -> `dual_manifold` viz, which needs
#      the actual STEERED geometric & linear paths, so the model is loaded and
#      path interventions are run for `max_pairs` pairs.
#
# Prerequisites already produced in this session (do NOT re-run):
#   - subspace/pca_k32_ctok/country                          (PCA-32 @ L12/country)
#   - activation_manifold/pca_k32_ctok/L12_country/spline_s0.0/country
#       MUST be a `parameter`-mode (capital lat/lon) TPS — the isometry metric
#       aligns activation/belief control points by class index and REQUIRES
#       matching 2-D intrinsic coords (isometry.py raises on a dim mismatch).
#
# This runner adds (run in `defaults` order):
#   - output_manifold/spline_s0.0/country   behavior/belief TPS, fit in the SAME
#       (lat, lon) parameterization so its control points align with the
#       activation manifold by class.
#   - path_steering isometry + dual_manifold + path landscapes.
#
# Behavior-space caveat (subject/neighbor readout, patch_parity verdict):
#   the steered variable is the question SUBJECT; the model emits its NEIGHBOR,
#   and which neighbor depends on the prompt DIRECTION. output_manifold's
#   per-class belief centroid is the answer distribution AVERAGED over all of a
#   country's prompts (i.e. over all 8 directions) -> a direction-blurred
#   neighbor profile. This is the simplest paper-analogous behavior space; a
#   direction-conditioned signature would be the richer (option-b) follow-up.
# ---------------------------------------------------------------------------
defaults:
  - /base
  - /task: country_borders
  - /model: gemma3_4b_pt
  - /analysis/output_manifold
  - /analysis/path_steering
  - _self_

task:
  target_variable: country

# Behavior/belief manifold: fit in the SAME intrinsic parameterization as the
# activation manifold (capital lat/lon). Pin intrinsic_dim=2 explicitly —
# output_manifold's parameter-mode auto-detect sums over ALL causal variables
# (would overcount here); 2 = (lat, lon), matching the activation control points.
output_manifold:
  intrinsic_mode: parameter
  intrinsic_dim: 2
  smoothness: 0.0

path_steering:
  # Point at the validated, already-fitted activation manifold cell.
  subspace: pca_k32_ctok
  activation_manifold: L12_country/spline_s0.0
  # Fig-3 target only: the isometry correlation. (coherence /
  # distance_from_behavior_manifold are left off to keep the run focused and
  # avoid criteria that assume a non-relational readout.)
  eval_criteria:
    - isometry
  path_modes:
    - geometric
    - linear
  # geometric path data + output_manifold artifacts feed dual_manifold; the
  # isometry scatter comes from the manifolds directly.
  visualizations:
    - path_visualization
    - isometry_visualization
    - dual_manifold
  selected_pairs: null      # unbiased; isometry uses all W*(W-1)/2 pairs regardless
  max_pairs: 50             # how many pairs get steered for dual_manifold / path plots
  num_steps_along_path: 150
  isometry:
    n_arc_steps: 150
    n_interior_per_pair: 1  # densify the scatter with 1 interior point per pair geodesic
