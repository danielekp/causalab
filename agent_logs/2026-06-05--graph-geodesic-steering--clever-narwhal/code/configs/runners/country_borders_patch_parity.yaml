# @package _global_
# Runner for the patch_parity diagnostic (steering-executor vs locate-mechanism A/B).
# MUST stay session-local: run_exp.sh injects the session Hydra --config-dir only when
# the runner config itself is session-local, and without that --config-dir the
# /analysis/patch_parity group won't resolve (same constraint as
# country_borders_graph_steering_demo.yaml).
#
# experiment_root stays at the global default so the existing
# artifacts/country_borders/gemma3_4b_pt/subspace/pca_k32 artifacts are reused
# (same convention as the graph-steering runner in this session).
#
# All patch_parity knobs (subspace, countries, arms, n_prompts, ...) come from the
# session-local configs/analysis/patch_parity.yaml defaults; override on the CLI if
# needed, e.g.:  patch_parity.interpolation_self_pairs=true
defaults:
  - /base
  - /task: country_borders
  - /model: gemma3_4b_pt
  - /analysis/patch_parity
  - _self_
task:
  target_variable: country
